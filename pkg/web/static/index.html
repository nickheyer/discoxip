<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiscoX</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
#screen { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: auto; }
#loading {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #0f0; font: 16px monospace; background: #000; z-index: 100; white-space: pre-wrap; padding: 16px;
}
#loading.hidden { display: none; }
#status { position: fixed; left: 8px; bottom: 8px; color: #0f0; font: 12px monospace; opacity: 0.7; white-space: pre-wrap; z-index: 50; }
</style>
</head>
<body>
<canvas id="screen" width="640" height="480"></canvas>
<div id="loading">Loading DiscoX...</div>
<div id="status"></div>
<script src="runtime.js"></script>
<script>
const loading = document.getElementById("loading"), statusLine = document.getElementById("status"), screen = document.getElementById("screen");
const stored = "discoxip.", held = new Set(), channel = new MessageChannel();
let queued = null;
channel.port1.onmessage = () => { const fn = queued; queued = null; fn(); };
addEventListener("keydown", (e) => { held.add(e.code); if (!e.ctrlKey && !e.metaKey && !e.altKey && !e.code.startsWith("F")) e.preventDefault(); });
addEventListener("keyup", (e) => held.delete(e.code));
addEventListener("blur", () => held.clear());
const bytesOf = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0));
const textOf = (bytes) => btoa(String.fromCharCode(...bytes));
start({
  now: () => performance.now(),
  clock: () => Date.now(),
  later: (ms, fn) => { if (ms <= 0) { queued = fn; channel.port2.postMessage(null); } else setTimeout(fn, ms); },
  load: (name) => new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = name;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("loading " + name));
    document.head.appendChild(script);
  }),
  read: async (name) => {
    const response = await fetch("data/" + name);
    if (!response.ok) throw new Error("fetching " + name + ": " + response.status);
    return new Uint8Array(await response.arrayBuffer());
  },
  store: (key, bytes) => { try { localStorage.setItem(stored + key, textOf(bytes)); } catch (e) {} },
  loaded: (key) => { try { const text = localStorage.getItem(stored + key); return text === null ? null : bytesOf(text); } catch (e) { return null; } },
  loadedAll: (prefix) => {
    const out = [];
    try { for (let i = 0; i < localStorage.length; i++) { const key = localStorage.key(i); if (key.startsWith(stored + prefix)) out.push([key.slice(stored.length), bytesOf(localStorage.getItem(key))]); } } catch (e) {}
    return out;
  },
  screen: () => screen,
  keys: () => held,
  gamepads: () => navigator.getGamepads ? Array.from(navigator.getGamepads()).filter((g) => g !== null) : [],
  shown: () => loading.classList.add("hidden"),
  status: (text) => { console.log("discoxip: " + text); loading.textContent = text; statusLine.textContent = text; },
  stopped: (text) => { console.error("discoxip: " + text); loading.textContent = "Stopped: " + text; loading.classList.remove("hidden"); },
}).catch((e) => { console.error("discoxip: " + e); loading.textContent = "Stopped: " + e; });
</script>
</body>
</html>
