<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xbox Dashboard</title>
<link rel="icon" href="data:,">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
#screen { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: auto; }
#loading {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #0f0; font: 16px monospace; background: #000; z-index: 100; white-space: pre-wrap; padding: 16px;
}
#loading.hidden { display: none; }
#status { position: fixed; left: 8px; bottom: 8px; color: #0f0; font: 12px monospace; opacity: 0.7; white-space: pre-wrap; z-index: 50; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="loading">Loading Xbox Dashboard...</div>
<div id="status"></div>
<script src="runtime.js"></script>
<script>
const loading = document.getElementById("loading"), statusLine = document.getElementById("status"), screen = document.getElementById("screen");
const stored = "discoxip.", held = new Set(), channel = new MessageChannel();
let queued = null;
channel.port1.onmessage = () => { const fn = queued; queued = null; fn(); };
addEventListener("keydown", (e) => { held.add(e.code); if (!e.ctrlKey && !e.metaKey && !e.altKey && !e.code.startsWith("F")) e.preventDefault(); });
addEventListener("keyup", (e) => held.delete(e.code));
addEventListener("blur", () => held.clear());
let audio = null;
const audioSink = (rate) => {
  if (audio !== null) return audio;
  const context = new AudioContext({ sampleRate: rate });
  const sink = `class Sink extends AudioWorkletProcessor {
    constructor() { super(); this.ring = new Float32Array(sampleRate * 2); this.head = 0; this.tail = 0; this.playing = false; this.port.onmessage = (e) => { if (e.data === null) { this.tail = this.head; this.playing = false; return; } const s = e.data; for (let i = 0; i < s.length; i++) { const next = (this.head + 1) % this.ring.length; if (next === this.tail) return; this.ring[this.head] = s[i] / 32768; this.head = next; } }; }
    process(inputs, outputs) {
      const left = outputs[0][0], right = outputs[0][1], held = (this.head - this.tail + this.ring.length) % this.ring.length;
      if (!this.playing) { if (held < sampleRate / 5) return true; this.playing = true; }
      for (let i = 0; i < left.length; i++) { if (this.tail === this.head) { left[i] = 0; right[i] = 0; this.playing = false; continue; } left[i] = this.ring[this.tail]; right[i] = this.ring[this.tail + 1]; this.tail = (this.tail + 2) % this.ring.length; }
      return true;
    }
  }
  registerProcessor("sink", Sink);`;
  let node = null;
  context.audioWorklet.addModule(URL.createObjectURL(new Blob([sink], { type: "text/javascript" }))).then(() => { node = new AudioWorkletNode(context, "sink", { numberOfInputs: 0, outputChannelCount: [2] }); node.connect(context.destination); });
  const resume = () => { if (context.state !== "running") { if (node !== null) node.port.postMessage(null); context.resume(); } };
  for (const type of ["keydown", "pointerdown", "touchstart"]) addEventListener(type, resume);
  audio = { rate: context.sampleRate, push: (samples) => { if (node === null) return; const copy = Int16Array.from(samples); node.port.postMessage(copy, [copy.buffer]); } };
  return audio;
};
const bytesOf = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0));
const textOf = (bytes) => btoa(String.fromCharCode(...bytes));
start({
  now: () => performance.now(),
  clock: () => Date.now(),
  later: (ms, fn) => { queued = ms <= 0 ? fn : () => setTimeout(fn, ms); channel.port2.postMessage(null); },
  load: (name) => new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = name;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("loading " + name));
    document.head.appendChild(script);
  }),
  read: async (name) => {
    const response = await fetch("data/" + name);
    if (!response.ok) throw new Error("fetching " + name + ": " + response.status);
    return new Uint8Array(await response.arrayBuffer());
  },
  store: (key, bytes) => { try { localStorage.setItem(stored + key, textOf(bytes)); } catch (e) {} },
  loaded: (key) => { try { const text = localStorage.getItem(stored + key); return text === null ? null : bytesOf(text); } catch (e) { return null; } },
  loadedAll: (prefix) => {
    const out = [];
    try { for (let i = 0; i < localStorage.length; i++) { const key = localStorage.key(i); if (key.startsWith(stored + prefix)) out.push([key.slice(stored.length), bytesOf(localStorage.getItem(key))]); } } catch (e) {}
    return out;
  },
  screen: () => screen,
  pixels: () => ({ width: screen.clientWidth * devicePixelRatio, height: screen.clientHeight * devicePixelRatio }),
  audio: audioSink,
  keys: () => held,
  gamepads: () => navigator.getGamepads ? Array.from(navigator.getGamepads()).filter((g) => g !== null) : [],
  shown: () => loading.classList.add("hidden"),
  status: (text) => { console.log("discoxip: " + text); loading.textContent = text; statusLine.textContent = text; },
  stopped: (text) => { console.error("discoxip: " + text); loading.textContent = "Stopped: " + text; loading.classList.remove("hidden"); },
}).catch((e) => { console.error("discoxip: " + e); loading.textContent = "Stopped: " + e; });
</script>
</body>
</html>
